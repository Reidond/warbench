name: Format Dump

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version: "22.19.0"
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Emit canonical source
        run: |
          vp check --fix
          for file in \
            src/benchmark.test.ts \
            src/benchmark.ts \
            src/codex-controller.test.ts \
            src/codex-controller.ts \
            src/index.ts \
            src/pdf-report.ts; do
            echo "WAR_BENCH_FILE_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "WAR_BENCH_FILE_END:$file"
          done
